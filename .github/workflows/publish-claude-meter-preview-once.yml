name: Publish Claude Meter 0.2.1 Android preview APK (one-time)

on:
  push:
    branches:
      - fix/restore-original-android-ui
    paths:
      - .github/workflows/publish-claude-meter-preview-once.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified v0.2.1 APK from successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 41902969852 --repo "$GITHUB_REPOSITORY" \
            --name android-0.2.1-brand-ci --dir dist
          test -s dist/ClaudeMeter-0.2.1.apk
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test -s dist/build.log

      - name: Publish publicly accessible prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.2.1-android-preview.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preview tag exists; verify its assets instead of overwriting."
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,url
            exit 0
          fi
          gh release create "$tag" \
            dist/ClaudeMeter-0.2.1.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 3d85873f71c3f49459a1ffaa92822e0512c4e055 \
            --title "Claude Meter 0.2.1 — Android preview APK" \
            --prerelease \
            --latest=false \
            --notes "Android phone-only preview. Automated tests, Android lint, APK signature checks and package build passed in workflow run 41902969852. Corrects Claude orange branding, profile-based Pro/Max/Ultra labels and old blue widget preferences. Real account sign-in, accurate usage reporting and Samsung widget appearance still require on-device validation. This preview uses a temporary signing key and may require uninstalling earlier builds before installation."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets,url --jq '.assets[].name + " " + .assets[].url'
