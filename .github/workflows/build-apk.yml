name: Build Claude Meter Android APK

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha, fix/restore-original-android-ui]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      GH_USERNAME: ${{ github.actor }}
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Install Android phone toolchains
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36" "build-tools;36.0.0"

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(awk -F'"' '/versionName = "/ { print $2; exit }' app/build.gradle.kts)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::Unable to read versionName from android/app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$VERSION_NAME"
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION_NAME" == *-* ]]; then
            PRERELEASE=true
          fi
          VERSION_CODE="$(awk '/versionCode = / { print $3; exit }' app/build.gradle.kts)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            LATEST_STABLE_TAG="$(git tag -l 'v*' | grep -v -- -               | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -n 1 || true)"
            if [[ -n "$LATEST_STABLE_TAG" ]]; then
              STABLE_CODE="$(git show "$LATEST_STABLE_TAG:android/app/build.gradle.kts"                 2>/dev/null | awk '/versionCode = / { print $3; exit }' || true)"
              if [[ -z "$STABLE_CODE" ]]; then
                echo "::warning::Could not read versionCode from $LATEST_STABLE_TAG"
              elif [[ "$PRERELEASE" == "true" && "$VERSION_CODE" -ne "$STABLE_CODE" ]]; then
                echo "::error::Prerelease must keep versionCode $STABLE_CODE (found $VERSION_CODE)"
                exit 1
              elif [[ "$PRERELEASE" == "false" && "$VERSION_CODE" -le "$STABLE_CODE" ]]; then
                echo "::error::Stable release must raise versionCode above $STABLE_CODE"
                exit 1
              fi
            fi
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Run regression tests
        run: ./run-tests.sh

      - name: Run Android lint
        run: ./lint.sh

      - name: Configure release signing
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_PASSWORD" || -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]]; then
            echo "::error::Add ANDROID_SIGNING_PASSWORD and ANDROID_SIGNING_KEYSTORE_BASE64 repository secrets"
            exit 1
          fi
          mkdir -p .local-signing
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > .local-signing/claude-meter-local.p12
          printf '%s' "$ANDROID_SIGNING_PASSWORD" > .local-signing/password
          chmod 600 .local-signing/claude-meter-local.p12 .local-signing/password
          "$JAVA_HOME/bin/keytool" -list \
            -keystore .local-signing/claude-meter-local.p12 \
            -storetype PKCS12 \
            -storepass:env ANDROID_SIGNING_PASSWORD \
            -alias claudemeter >/dev/null

      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./build.sh 2>&1 | tee dist/build.log

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ steps.version.outputs.name }}-ci
          path: android/dist/
          if-no-files-found: error
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release sources
        uses: actions/checkout@v7

      - name: Download verified APKs
        uses: actions/download-artifact@v8
        with:
          name: android-${{ needs.build.outputs.version }}-ci
          path: release-dist

      - name: Verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          sha256sum -c SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        env:
          VERSION_NAME: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION_NAME" '
            $0 == "## " version || index($0, "## " version " —") == 1 {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no release notes for $VERSION_NAME"
            exit 1
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME"               --draft               --verify-tag               --prerelease="$PRERELEASE"               --notes-file release-notes.md               --title "Claude Meter $VERSION_NAME"
          else
            gh release edit "$GITHUB_REF_NAME"               --prerelease="$PRERELEASE"               --notes-file release-notes.md               --title "Claude Meter $VERSION_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME"             "release-dist/ClaudeMeter-$VERSION_NAME.apk#Claude Meter $VERSION_NAME APK"             "release-dist/SHA256SUMS.txt#SHA-256 checksums"             --clobber
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
