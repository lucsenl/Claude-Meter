name: Build Claude Meter Android APKs

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      GH_USERNAME: ${{ github.actor }}
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Install Android toolchains
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(awk -F'"' '/versionName = "/ { print $2; exit }' app/build.gradle.kts)"
          [[ -n "$VERSION_NAME" ]] || { echo "::error::Unable to read versionName"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$VERSION_NAME"
            exit 1
          fi
          PRERELEASE=false
          [[ "$VERSION_NAME" == *-* ]] && PRERELEASE=true
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Configure Claude Meter release signing
        if: github.ref_type == 'tag'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CLAUDE_METER_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.CLAUDE_METER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_B64" ]] || { echo "::error::Missing CLAUDE_METER_SIGNING_KEYSTORE_BASE64"; exit 1; }
          [[ -n "$SIGNING_PASSWORD" ]] || { echo "::error::Missing CLAUDE_METER_SIGNING_PASSWORD"; exit 1; }
          mkdir -p .local-signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .local-signing/claude-meter-local.p12
          printf '%s' "$SIGNING_PASSWORD" > .local-signing/password
          chmod 600 .local-signing/claude-meter-local.p12 .local-signing/password
          "$JAVA_HOME/bin/keytool" -list \
            -keystore .local-signing/claude-meter-local.p12 \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -alias claudemeter >/dev/null

      - name: Run regression tests
        run: ./run-tests.sh

      - name: Run Android lint
        run: ./lint.sh

      - name: Build and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./build.sh 2>&1 | tee dist/build.log

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: claude-meter-${{ steps.version.outputs.name }}-ci
          path: android/dist/
          if-no-files-found: error
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download verified APKs
        uses: actions/download-artifact@v8
        with:
          name: claude-meter-${{ needs.build.outputs.version }}-ci
          path: release-dist

      - name: Verify checksums
        run: |
          cd release-dist
          sha256sum -c SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        env:
          VERSION_NAME: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION_NAME" '
            $0 == "## " version || index($0, "## " version " —") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --prerelease="$PRERELEASE" --notes-file release-notes.md \
              --title "Claude Meter $VERSION_NAME"
          else
            gh release edit "$GITHUB_REF_NAME" --prerelease="$PRERELEASE" \
              --notes-file release-notes.md --title "Claude Meter $VERSION_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "release-dist/ClaudeMeter-$VERSION_NAME.apk#Claude Meter $VERSION_NAME APK" \
            "release-dist/ClaudeMeter-Wear-$VERSION_NAME.apk#Claude Meter Wear OS $VERSION_NAME APK" \
            "release-dist/SHA256SUMS.txt#SHA-256 checksums" --clobber
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
